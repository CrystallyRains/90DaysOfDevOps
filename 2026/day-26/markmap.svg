<th>Action</th>
<th>Command</th>
</tr>
</thead>
<tbody data-lines="16,22">
<tr data-lines="16,17">
<td>Create repo</td>
<td><code>gh repo create test-gh-cli --public --add-readme</code></td>
</tr>
<tr data-lines="17,18">
<td>Clone repo</td>
<td><code>gh repo clone CrystallyRains/90DaysOfDevOps</code></td>
</tr>
<tr data-lines="18,19">
<td>View details</td>
<td><code>gh repo view CrystallyRains/90DaysOfDevOps</code></td>
</tr>
<tr data-lines="19,20">
<td>List repos</td>
<td><code>gh repo list CrystallyRains --limit 30</code></td>
</tr>
<tr data-lines="20,21">
<td>Open in browser</td>
<td><code>gh repo view --web</code></td>
</tr>
<tr data-lines="21,22">
<td>Delete repo</td>
<td><code>gh repo delete test-gh-cli --yes</code> (needed <code>delete_repo</code> scope refresh)</td>
</tr>
</tbody>
</table></div></div></foreignObject></g><g data-depth="2" data-path="1.7" class="markmap-node" transform="translate(503, -228.96875)"><line stroke="#e377c2" stroke-width="1.75" x1="-1" x2="256" y1="20.875" y2="20.875"/><circle stroke-width="1.5" r="6" stroke="#e377c2" fill="var(--markmap-circle-open-bg)" cx="254" cy="20.875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="238" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">Task 2: Working with Repositories</div></div></foreignObject></g><g data-depth="3" data-path="1.9.10" class="markmap-node" transform="translate(700, -131.59375)"><line stroke="#17becf" stroke-width="1.375" x1="-1" x2="488" y1="109.6875" y2="109.6875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="470" height="109"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml"><table data-lines="26,32">
