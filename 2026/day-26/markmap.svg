<tbody data-lines="43,49">
<tr data-lines="43,44">
<td>Create branch</td>
<td><code>git checkout -b day26-gh-cli-notes</code></td>
</tr>
<tr data-lines="44,45">
<td>Push branch</td>
<td><code>git push -u origin day26-gh-cli-notes</code></td>
</tr>
<tr data-lines="45,46">
<td>Create PR</td>
<td><code>gh pr create --fill</code></td>
</tr>
<tr data-lines="46,47">
<td>List PRs</td>
<td><code>gh pr list</code></td>
</tr>
<tr data-lines="47,48">
<td>View PR</td>
<td><code>gh pr view 2</code></td>
</tr>
<tr data-lines="48,49">
<td>Merge PR</td>
<td><code>gh pr merge 2 --squash --delete-branch</code></td>
</tr>
</tbody>
